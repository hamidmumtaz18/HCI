<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>University of Oxford – Student Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="left">
      <div class="card">
        <img class="logo" src="images/oxford-logo.png" alt="University of Oxford">

        <header>
          <h1>Welcome!</h1>
          <p class="sub">Please enter your details to log in.</p>
        </header>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="name@example.com" autocomplete="username">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="show" id="toggle">Show</button>
            </div>
          </div>

          <div class="options">
            <label class="remember"><input type="checkbox"> Remember me</label>
            <a href="#">Forgot Password?</a>
          </div>

          <p class="error" id="error" role="alert"></p>
          <button type="submit" class="login">Login</button>
        </form>

        <p class="signup">Don’t have an account? <a href="#">Sign Up</a></p>
      </div>
    </section>

    <aside class="picture" role="img" aria-label="Oxford college building and garden"></aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
